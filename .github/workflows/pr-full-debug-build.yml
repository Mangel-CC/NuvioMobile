name: PR Full Debug Build

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [cmp-rewrite]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-full-debug-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full-debug-build:
    name: Build fullDebug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare runtime properties
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
          NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL }}
          NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
          NUVIO_SUPABASE_FALLBACK_URL: ${{ secrets.NUVIO_SUPABASE_FALLBACK_URL }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          TRAKT_REDIRECT_URI: ${{ secrets.TRAKT_REDIRECT_URI }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_REDIRECT_URI: ${{ secrets.SIMKL_REDIRECT_URI }}
          SIMKL_APP_NAME: ${{ secrets.SIMKL_APP_NAME }}
          MDBLIST_CLIENT_ID: ${{ secrets.MDBLIST_CLIENT_ID }}
          PREMIUMIZE_CLIENT_ID: ${{ secrets.PREMIUMIZE_CLIENT_ID }}
          INTRODB_API_URL: ${{ secrets.INTRODB_API_URL }}
          IMDB_RATINGS_API_BASE_URL: ${{ secrets.IMDB_RATINGS_API_BASE_URL }}
          IMDB_TAPFRAME_API_BASE_URL: ${{ secrets.IMDB_TAPFRAME_API_BASE_URL }}
          CONTRIBUTIONS_URL: ${{ secrets.CONTRIBUTIONS_URL }}
          SUPPORTERS_WALL_URL: ${{ secrets.SUPPORTERS_WALL_URL }}
          DONATIONS_BASE_URL: ${{ secrets.DONATIONS_BASE_URL }}
          DONATIONS_DONATE_URL: ${{ secrets.DONATIONS_DONATE_URL }}
        run: |
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
            sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties
          else
            touch local.properties
          fi

          # Fork: repository secrets named like a build property (see fork-config-keys.txt).
          python3 .github/scripts/apply-fork-secrets.py .github/scripts/fork-config-keys.txt local.properties

      - name: Build fullDebug APK
        run: ./gradlew :androidApp:assembleFullDebug -Pnuvio.android.distribution=full -Pnuvio.ios.distribution=appstore --stacktrace

      - name: Upload fullDebug APK
        uses: actions/upload-artifact@v7
        with:
          path: androidApp/build/outputs/apk/full/debug/androidApp-full-debug.apk
          archive: false
          if-no-files-found: error
          retention-days: 7
